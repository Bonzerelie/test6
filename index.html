<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relative Pitch Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1 class="center-text">The Relative Pitch Game! 🎹🎶</h1>
    <h2 class="center-text">Chromatic</h2>
    <button id="start-button" class="green-button center-button">Start</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" style="display: none;">
    <p id="question" class="center-text">Which note was played?</p>

    <div id="note-buttons"></div>

    <div class="controls">
      <button id="play-reference" class="green-button">Play Reference (C4)</button>
      <button id="replay-note" class="green-button">Replay Note</button>
      <button id="next-button" class="green-button" disabled>Next</button>
    </div>

    <button id="reset-button" class="green-button center-button">Reset Score</button>

    <div id="score">
      <p>Correct: <span id="correct-count">0</span></p>
      <p>Incorrect: <span id="incorrect-count">0</span></p>
      <p>Total: <span id="total-count">0</span></p>
      <p>Accuracy: <span id="accuracy">0.0%</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
